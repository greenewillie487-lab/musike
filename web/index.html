<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Your music, uninterrupted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Musike" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Musike</title>
    <script>
      try {
        var t = localStorage.getItem("musike:theme");
        // "system" (the default) resolves against the iPhone's appearance before first paint,
        // and a media-query listener keeps it live — no restart, no wrong-theme flash.
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var themeMq = window.matchMedia("(prefers-color-scheme: dark)");
          var themeListener = function (e) {
            if ((localStorage.getItem("musike:theme") || "system") !== "system") return;
            document.documentElement.dataset.theme = e.matches ? "dark" : "light";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", e.matches ? "#000000" : "#F2F2F7");
          };
          if (themeMq.addEventListener) themeMq.addEventListener("change", themeListener);
          else if (themeMq.addListener) themeMq.addListener(themeListener);
        }
        // Before the app loads, so screen readers and the browser see the chosen language right away.
        var l = localStorage.getItem("musike:lang");
        if (l === "en" || l === "pt-BR") document.documentElement.lang = l;
        // Appearance chosen in Settings, applied before the first paint.
        var css = localStorage.getItem("musike:accent-css");
        var a = JSON.parse(localStorage.getItem("musike:appearance") || "{}");
        // Devices that never picked a color follow the redesign's new default.
        if (a.accent === "#c3ec52") {
          localStorage.removeItem("musike:accent-css");
          css = null;
        }
        if (css) {
          var s = document.createElement("style");
          s.id = "musike-accent";
          s.textContent = css;
          document.head.appendChild(s);
        }
        if (a.compactSidebar === true) document.documentElement.dataset.rail = "compact";
        if (a.texture === false) document.documentElement.dataset.texture = "off";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
